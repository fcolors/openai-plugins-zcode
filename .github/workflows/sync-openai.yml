name: Sync OpenAI Plugins

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone OpenAI plugins
        run: |
          git clone \
            --depth=1 \
            https://github.com/openai/plugins.git \
            /tmp/openai-plugins

      - name: Sync upstream plugins
        run: |
          rm -rf plugins
          cp -a /tmp/openai-plugins/plugins ./plugins

      - name: Convert plugins for ZCode
        run: |
          python3 scripts/convert.py

      - name: Commit changes
        run: |
          git config user.name "openai-plugin-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add plugins marketplace.json

          if git diff --cached --quiet; then
            echo "No upstream changes."
            exit 0
          fi

          git commit -m "chore: sync OpenAI plugins"
          git push